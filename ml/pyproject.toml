[project]
name = "ml"
version = "0.1.0"
description = "PhishLens Machine Learning Pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }
